##
# docker-compose.e2e.yml — Quorum Dashboard browser E2E environment.
#
# KEY PROPERTIES
#   - Joins the external 'quorum-e2e_e2e' Docker network created by the quorum
#     backend E2E stack (quorum/docker-compose.e2e.yml). This avoids duplicating
#     all backend service definitions (gateway, localstack, graphiti, etc.).
#   - Only adds two services: the dashboard nginx container and the Playwright
#     browser test runner.
#   - The dashboard service resolves 'gateway:3001' via Docker internal DNS —
#     the same gateway the API-level E2E tests use.
#
# PREREQUISITE
#   The quorum backend E2E stack must be running first:
#     cd ../quorum && npm run test:e2e:docker:up
#   This creates the quorum-e2e_e2e network and starts the gateway.
#
# USAGE (via npm scripts from quorum-dash/)
#   npm run test:e2e:docker         # full isolated run (up + tests + down)
#   npm run test:e2e:docker:up      # start backend + dashboard only
#   npm run test:e2e:docker:run     # run tests against a running stack
#   npm run test:e2e:docker:down    # stop everything (backend + dashboard)
#   npm run test:e2e:docker:clean   # stop + wipe volumes (fresh state)
#
# OR directly:
#   npm --prefix ../quorum run test:e2e:docker:up
#   docker compose -f docker-compose.e2e.yml up -d --build --wait dashboard
#   docker compose -f docker-compose.e2e.yml run --rm browser-test-runner
#   docker compose -f docker-compose.e2e.yml down
##

name: quorum-dash-e2e

networks:
  # External network created by quorum/docker-compose.e2e.yml (project: quorum-e2e).
  # All backend services (gateway, graphiti, localstack, etc.) are on this network.
  # Dashboard and browser-test-runner join it so they can reach gateway:3001.
  e2e:
    external: true
    name: quorum-e2e_e2e

services:

  # ── Dashboard (nginx SPA) ───────────────────────────────────────────────────
  #
  # Built from the same Dockerfile used for production-like local Docker deploys.
  # nginx proxies /api/* and /auth/* → gateway:3001 over Docker internal DNS.
  # The browser test runner visits http://dashboard:8080 directly.
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    networks: [e2e]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  # ── Browser test runner ─────────────────────────────────────────────────────
  #
  # Runs Playwright @ui specs with system Chromium. Source code is bind-mounted —
  # NOT baked into the image. The anonymous volume at /workspace/node_modules
  # ensures Alpine-compiled native binaries shadow macOS host modules.
  #
  # QUORUM_DASHBOARD_URL=http://dashboard:8080 tells playwright.config.js the
  # dashboard is already running (not localhost), so the Vite webServer auto-start
  # is skipped — the nginx container is used instead.
  #
  # Start via: npm run test:e2e:docker:run   (from quorum-dash/)
  # Or:        docker compose -f docker-compose.e2e.yml run --rm browser-test-runner
  #
  # Targeted run:
  #   docker compose -f docker-compose.e2e.yml run --rm browser-test-runner \
  #     npx playwright test --grep "S-14"
  browser-test-runner:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    networks: [e2e]
    environment:
      - QUORUM_GATEWAY_URL=http://gateway:3001
      - QUORUM_DASHBOARD_URL=http://dashboard:8080
      - NODE_ENV=test
    volumes:
      # Bind-mount source: test results and playwright-report are written to the
      # host working directory after the run.
      - .:/workspace
      # Anonymous volume: Alpine-compiled node_modules shadow the macOS host ones.
      - /workspace/node_modules
    depends_on:
      dashboard:
        condition: service_healthy
